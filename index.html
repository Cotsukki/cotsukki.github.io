<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Review App</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f6f8;
    color: #333;
  }
  header {
    background-color: #0056b3;
    padding: 15px;
    display: flex;
    overflow-x: auto;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .topic-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  .topic-btn.active {
    background: white;
    color: #0056b3;
    font-weight: bold;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }
  .stats-bar {
    display: flex;
    justify-content: space-between;
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: 500;
  }
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .filter-btn {
    flex: 1;
    padding: 12px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
  }
  .filter-btn.active {
    background: #0056b3;
    color: white;
    border-color: #0056b3;
  }
  .question-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  .grid-item {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    border: 1px solid #ddd;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }
  .grid-item.active {
    border: 2px solid #0056b3;
    font-weight: bold;
  }
  .grid-item.correct { background: #d4edda; border-color: #c3e6cb; color: #155724; }
  .grid-item.wrong { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
  .card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 20px;
  }
  .prompt {
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 20px;
    font-weight: 500;
  }
  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 15px;
    margin-bottom: 10px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .choice-btn:disabled {
    cursor: default;
  }
  .choice-btn.selected-correct { background: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: bold; }
  .choice-btn.selected-wrong { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
  .choice-btn.actual-correct { background: #d4edda; border-color: #c3e6cb; color: #155724; border-width: 2px; }
  
  .note-box {
    margin-top: 20px;
    padding: 15px;
    background: #e9ecef;
    border-radius: 5px;
    font-size: 15px;
    line-height: 1.5;
    display: none;
  }
  .nav-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
  }
  .nav-btn {
    padding: 12px 25px;
    background: #6c757d;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
  }
  .nav-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .clear-btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
  }
</style>
</head>
<body>

<header id="topic-header"></header>

<div class="container">
  <div class="stats-bar">
    <span id="stat-correct">Correct: 0</span>
    <span id="stat-missed">Missed: 0</span>
    <span id="stat-left">Left: 0</span>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="unanswered">Unanswered</button>
    <button class="filter-btn" data-filter="missed">Missed</button>
  </div>

  <div class="question-grid" id="question-grid"></div>

  <div class="card" id="question-container">
    <div class="prompt" id="q-prompt"></div>
    <div id="q-choices"></div>
    <div class="note-box" id="q-note"></div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="btn-prev">Previous</button>
    <button class="nav-btn" id="btn-next">Next</button>
  </div>

  <button class="clear-btn" id="btn-clear">Clear Progress</button>
</div>

<script>
let topicsCatalog = [];
let currentTopicData = null; 
let currentActiveTopicId = null;
let currentList = [];
let currentIndex = 0;
let currentFilter = 'all';
let progress = {};

const elements = {
  header: document.getElementById('topic-header'),
  statCorrect: document.getElementById('stat-correct'),
  statMissed: document.getElementById('stat-missed'),
  statLeft: document.getElementById('stat-left'),
  grid: document.getElementById('question-grid'),
  prompt: document.getElementById('q-prompt'),
  choices: document.getElementById('q-choices'),
  note: document.getElementById('q-note'),
  btnPrev: document.getElementById('btn-prev'),
  btnNext: document.getElementById('btn-next'),
  btnClear: document.getElementById('btn-clear'),
  filters: document.querySelectorAll('.filter-btn')
};

async function init() {
  loadProgress();
  setupEventListeners();

  try {
    const response = await fetch('topics.json');
    if (!response.ok) throw new Error("Could not fetch topics.json");
    topicsCatalog = await response.json();
    
    renderTopicHeaders();
    
    if (topicsCatalog.length > 0) {
      await loadTopic(topicsCatalog[0]);
    }
  } catch (error) {
    elements.prompt.textContent = "Error loading topics.json. Ensure the file is uploaded to GitHub alongside this index.html.";
  }
}

function setupEventListeners() {
  elements.btnPrev.addEventListener('click', () => navigate(-1));
  elements.btnNext.addEventListener('click', () => navigate(1));
  elements.btnClear.addEventListener('click', clearTopicProgress);
  
  elements.filters.forEach(btn => {
    btn.addEventListener('click', (e) => {
      elements.filters.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      applyFilter();
    });
  });
}

function renderTopicHeaders() {
  elements.header.innerHTML = '';
  topicsCatalog.forEach(topicMeta => {
    const btn = document.createElement('button');
    btn.className = `topic-btn ${topicMeta.id === currentActiveTopicId ? 'active' : ''}`;
    btn.textContent = topicMeta.name;
    btn.addEventListener('click', () => loadTopic(topicMeta));
    elements.header.appendChild(btn);
  });
}

async function loadTopic(topicMeta) {
  if (currentActiveTopicId === topicMeta.id) return;

  elements.prompt.textContent = `Loading ${topicMeta.name}...`;
  elements.choices.innerHTML = '';
  elements.grid.innerHTML = '';
  elements.note.style.display = 'none';

  try {
    const response = await fetch(topicMeta.file);
    if (!response.ok) throw new Error(`Could not fetch ${topicMeta.file}`);
    
    currentTopicData = await response.json();
    currentActiveTopicId = topicMeta.id;
    
    if (!progress[currentTopicData.topic]) {
      progress[currentTopicData.topic] = {};
    }
    
    renderTopicHeaders();
    
    currentFilter = 'all';
    elements.filters.forEach(b => b.classList.remove('active'));
    elements.filters[0].classList.add('active');
    
    applyFilter();
  } catch (error) {
    elements.prompt.textContent = `Error loading ${topicMeta.file}. Make sure it is uploaded.`;
  }
}

function loadProgress() {
  const saved = localStorage.getItem('reviewAppProgress');
  if (saved) {
    progress = JSON.parse(saved);
  }
}

function saveProgress() {
  localStorage.setItem('reviewAppProgress', JSON.stringify(progress));
  updateStats();
  renderGrid();
}

function applyFilter() {
  if (!currentTopicData) return;
  
  const topicProgress = progress[currentTopicData.topic];
  
  if (currentFilter === 'all') {
    currentList = [...currentTopicData.questions];
  } else if (currentFilter === 'unanswered') {
    currentList = currentTopicData.questions.filter(q => !topicProgress[q.id]);
  } else if (currentFilter === 'missed') {
    currentList = currentTopicData.questions.filter(q => topicProgress[q.id] && !topicProgress[q.id].correct);
  }
  
  currentIndex = 0;
  updateStats();
  renderGrid();
  renderQuestion();
}

function updateStats() {
  const topicProgress = progress[currentTopicData.topic];
  let correct = 0, missed = 0, left = 0;
  
  currentTopicData.questions.forEach(q => {
    if (!topicProgress[q.id]) left++;
    else if (topicProgress[q.id].correct) correct++;
    else missed++;
  });
  
  elements.statCorrect.textContent = `Correct: ${correct}`;
  elements.statMissed.textContent = `Missed: ${missed}`;
  elements.statLeft.textContent = `Left: ${left}`;
}

function renderGrid() {
  elements.grid.innerHTML = '';
  const topicProgress = progress[currentTopicData.topic];
  
  currentList.forEach((q, index) => {
    const btn = document.createElement('div');
    btn.className = `grid-item ${index === currentIndex ? 'active' : ''}`;
    btn.textContent = index + 1;
    
    if (topicProgress[q.id]) {
      btn.classList.add(topicProgress[q.id].correct ? 'correct' : 'wrong');
    }
    
    btn.addEventListener('click', () => {
      currentIndex = index;
      renderGrid();
      renderQuestion();
    });
    
    elements.grid.appendChild(btn);
  });
}

function renderQuestion() {
  if (currentList.length === 0) {
    elements.prompt.textContent = "No questions match the current filter.";
    elements.choices.innerHTML = '';
    elements.note.style.display = 'none';
    elements.btnPrev.disabled = true;
    elements.btnNext.disabled = true;
    return;
  }
  
  const q = currentList[currentIndex];
  const topicProgress = progress[currentTopicData.topic];
  const answeredData = topicProgress[q.id];
  
  elements.prompt.textContent = `${currentIndex + 1}. ${q.prompt}`;
  elements.choices.innerHTML = '';
  
  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${choice.letter}. ${choice.text}`;
    
    if (answeredData) {
      btn.disabled = true;
      if (choice.letter === answeredData.selected) {
        btn.classList.add(answeredData.correct ? 'selected-correct' : 'selected-wrong');
      }
      if (!answeredData.correct && choice.letter === q.answer) {
        btn.classList.add('actual-correct');
      }
    } else {
      btn.addEventListener('click', () => handleAnswer(q.id, choice.letter, q.answer));
    }
    
    elements.choices.appendChild(btn);
  });
  
  if (answeredData && q.note) {
    elements.note.textContent = q.note;
    elements.note.style.display = 'block';
  } else {
    elements.note.style.display = 'none';
  }
  
  elements.btnPrev.disabled = currentIndex === 0;
  elements.btnNext.disabled = currentIndex === currentList.length - 1;
}

function handleAnswer(qId, selected, correctLetter) {
  const isCorrect = selected === correctLetter;
  progress[currentTopicData.topic][qId] = {
    selected: selected,
    correct: isCorrect
  };
  saveProgress();
  renderQuestion();
}

function navigate(dir) {
  currentIndex += dir;
  renderGrid();
  renderQuestion();
}

function clearTopicProgress() {
  if (confirm(`Are you sure you want to clear your progress for ${currentTopicData.topic}?`)) {
    progress[currentTopicData.topic] = {};
    saveProgress();
    applyFilter();
  }
}

init();
</script>
</body>
</html>
